params:
seed: 42

env:
clip_actions: 1.0

algo:
name: sac

model:
name: soft_actor_critic

network:
name: soft_actor_critic
separate: True
space:
continuous:
mlp:
units: [32, 16]
activation: relu
initializer:
name: default
log_std_bounds: [-7, 2]

load_checkpoint: False
load_path:

config:
name: limo_pendulum
env_name: rlgpu
multi_gpu: False
normalize_input: True
reward_shaper:
scale_value: 1.0
max_epochs: 20000
num_steps_per_episode: 50
save_best_after: 100
save_frequency: 200
gamma: 0.99
init_alpha: 1.0
alpha_lr: 0.003
actor_lr: 0.0003
critic_lr: 0.0003
critic_tau: 0.005
batch_size: 256
learnable_temperature: True
num_seed_steps: 5
num_warmup_steps: 10
replay_buffer_size: 1000000
num_actors: 4096
mixed_precision: True
normalize_value: True
grad_norm: 1.0
device: ‘cuda:0’