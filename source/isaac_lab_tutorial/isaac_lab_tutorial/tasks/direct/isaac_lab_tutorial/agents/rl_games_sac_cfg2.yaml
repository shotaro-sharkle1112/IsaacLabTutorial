params:  
  seed: 42
  algo:
    name: sac

  model:
    name: soft_actor_critic

  network:
    name: soft_actor_critic
    separate: True
    space:
      continuous:
    mlp:
      units: [128, 64]
      activation: relu
      
      initializer:
        name: default
    log_std_bounds: [-5, 2]

  config:
    name: limo-pendulum
    env_name: rlgpu
    normalize_input: True
    reward_shaper:
      scale_value: 1
    device: cuda
    max_epochs: 1000
    num_steps_per_episode: 16
    save_best_after: 100
    save_frequency: 10000
    gamma: 0.99
    init_alpha: 1
    alpha_lr: 0.0005
    actor_lr: 0.0005
    critic_lr: 0.0005
    critic_tau: 0.005
    batch_size: 1024
    learnable_temperature: True
    num_warmup_steps: 10 # total number of warmup steps: num_actors * num_steps_per_episode * num_warmup_steps
    replay_buffer_size: 10000
    num_actors: 100

    env_config:
      env_name: ant

  env:
    clip_actions: 1.0
    clip_observations: 2.0